
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SceneComposer AI | HKBU 70th</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              hkbu: {
                navy: '#002d61',
                gold: '#C5A059',
                goldLight: '#E3C58B',
                cream: '#FDFBF3',
                silver: '#C0C0C0'
              }
            },
            keyframes: {
              'confetti-burst': {
                '0%': { transform: 'translate(0, 0) rotate(0) scale(1)', opacity: '1' },
                '100%': { transform: 'translate(var(--dx), var(--dy)) rotate(var(--dr)) scale(0)', opacity: '0' }
              },
              'ribbon-float': {
                '0%, 100%': { transform: 'translateY(0) rotate(0deg)' },
                '50%': { transform: 'translateY(-20px) rotate(2deg)' }
              }
            },
            animation: {
              'confetti-burst': 'confetti-burst var(--duration) cubic-bezier(0.1, 0.5, 0.2, 1) forwards',
              'ribbon-float': 'ribbon-float 15s ease-in-out infinite'
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FDFBF3;
        color: #002d61;
      }
      .selection-gold::selection {
        background-color: #C5A059;
        color: #ffffff;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.32.0",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/"
  }
}
</script>
</head>
  <body class="selection-gold">
    <div id="root"></div>
  </body>
</html>
